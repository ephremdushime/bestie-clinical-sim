services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      CLINICAL_SIM_DB: /data/clinical_sim.db
    volumes:
      - clinical_sim_data:/data
    restart: unless-stopped
    expose:
      - "8000"
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
volumes:
  clinical_sim_data:
